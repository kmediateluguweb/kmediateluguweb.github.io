
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K Media Telugu | News</title>
<meta name="description" content="K Media Telugu తాజా తెలుగు వార్తలు">
<meta name="robots" content="noindex,follow">
<meta property="og:site_name" content="K Media Telugu">
<meta property="og:type" content="article">
<meta property="og:locale" content="te_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kmediatelugu.rweb.site/article.html">
<link rel="icon" href="K%20Media%20Logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.article-wrap{max-width:850px;margin:45px auto;background:#fff;padding:28px;border-radius:14px}
.article-wrap img{width:100%;max-height:480px;object-fit:cover;border-radius:10px}
.article-content{font-size:18px;line-height:1.9;white-space:pre-wrap}
.article-meta{color:#777}
@media(max-width:700px){.article-wrap{margin:20px auto;padding:18px}}
</style>
</head>
<body>

<header class="top">
<div class="container nav">
<a class="logo" href="index.html">K MEDIA <span>TELUGU</span></a>
<nav>
<a href="index.html">హోమ్</a>
<a href="index.html#latest">తాజా వార్తలు</a>
</nav>
</div>
</header>

<main class="container">
<article id="article" class="article-wrap">వార్త లోడ్ అవుతోంది...</article>
</main>

<footer>
<div class="copyright">© 2026 K Media Telugu. All rights reserved. | <a style="color:#fff" href="privacy-policy.html">Privacy Policy</a></div>
</footer>

<script>
const db=window.supabase.createClient(
"https://mewyojxgsuceppsauesh.supabase.co",
"sb_publishable_-ee5Pt9U0ZvZuUkipLcq-Q_KBXKsEDa"
);

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

(async()=>{
const id=new URLSearchParams(location.search).get('id');
const box=document.getElementById('article');

if(!id){
box.textContent='వార్త ID దొరకలేదు.';
return;
}

const {data,error}=await db.from('news_articles')
.select('title,seo_title,meta_description,summary,content,featured_image,published_at,status')
.eq('id',id)
.eq('status','published')
.maybeSingle();

if(error||!data){
box.textContent='వార్త అందుబాటులో లేదు. మళ్లీ ప్రయత్నించండి.';
console.error(error);
return;
}

const seoTitle=data.seo_title||data.title;
const staticArticleUrl = "https://kmediatelugu.rweb.site/articles/news-"+String(id).replace(/[^a-zA-Z0-9]/g,"").slice(0,8)+"/";
const metaDescription=data.meta_description||data.summary||data.title;


const articleSchema = {
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": seoTitle,
  "description": metaDescription,
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": staticArticleUrl
  },
  "publisher": {
    "@type": "NewsMediaOrganization",
    "@id": "https://kmediatelugu.rweb.site/#organization",
    "name": "K Media Telugu",
    "logo": {
      "@type": "ImageObject",
      "url": "https://kmediatelugu.rweb.site/K%20Media%20Logo.jpg"
    }
  },
  "author": {
    "@type": "Organization",
    "name": "K Media Telugu"
  },
  "inLanguage": "te-IN",
  ...(data.featured_image ? {"image": [data.featured_image]} : {}),
  ...(data.published_at ? {"datePublished": data.published_at, "dateModified": data.published_at} : {}), "url": staticArticleUrl
};
const schemaScript = document.createElement('script');
schemaScript.type = 'application/ld+json';
schemaScript.textContent = JSON.stringify(articleSchema);
document.head.appendChild(schemaScript);

document.title=seoTitle+' | K Media Telugu';

let description=document.querySelector('meta[name="description"]');
description.setAttribute('content',metaDescription);

let ogTitle=document.createElement('meta');
ogTitle.setAttribute('property','og:title');
ogTitle.setAttribute('content',seoTitle);
document.head.appendChild(ogTitle);

let ogDescription=document.createElement('meta');
ogDescription.setAttribute('property','og:description');
ogDescription.setAttribute('content',metaDescription);
document.head.appendChild(ogDescription);

const socialMeta = (attr, key, value) => {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute(attr, key); document.head.appendChild(tag); }
  tag.setAttribute('content', value);
};
socialMeta('property','og:type','article');
socialMeta('property','og:image',data.featured_image || 'https://kmediatelugu.rweb.site/K%20Media%20Logo.jpg');
socialMeta('property','og:url',staticArticleUrl);
socialMeta('name','twitter:card','summary_large_image');
socialMeta('name','twitter:title',seoTitle);
socialMeta('name','twitter:description',metaDescription);
socialMeta('name','twitter:image',data.featured_image || 'https://kmediatelugu.rweb.site/K%20Media%20Logo.jpg');

let canonical=document.querySelector('link[rel="canonical"]');
if (!canonical) { canonical=document.createElement('link'); canonical.setAttribute('rel','canonical'); document.head.appendChild(canonical); }
canonical.setAttribute('href',staticArticleUrl);
socialMeta('property','og:site_name','K Media Telugu');
socialMeta('property','og:locale','te_IN');

box.innerHTML=`
${data.featured_image?`<img src="${esc(data.featured_image)}" alt="${esc(data.title)}">`:''}
<p class="eyebrow">K MEDIA TELUGU</p>
<h1>${esc(data.title)}</h1>
<p class="article-meta">${data.published_at?new Date(data.published_at).toLocaleString('te-IN'):''}</p>
${data.summary?`<p><strong>${esc(data.summary)}</strong></p>`:''}
<div class="article-content">${esc(data.content)}</div>
<p><a href="index.html">← హోమ్‌కు తిరిగి వెళ్లండి</a></p>
`;
})();
</script>
</body>
</html>
