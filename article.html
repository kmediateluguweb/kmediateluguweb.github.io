
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K Media Telugu | News</title>
<meta name="description" content="K Media Telugu తాజా తెలుగు వార్తలు">
<meta name="robots" content="noindex,follow">
<meta property="og:site_name" content="K Media Telugu">
<meta property="og:type" content="article">
<meta property="og:locale" content="te_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kmediatelugu.com/article.html">
<link rel="icon" href="/K%20Media%20Logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="/style.css?v=20261108-1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light}
body{background:#fff8fc!important;color:#242033;font-family:Arial,"Noto Sans Telugu",sans-serif}
.top{background:#fff!important;border-bottom:1px solid #f0e4ed;box-shadow:none!important}
.top .container.nav{max-width:720px;min-height:54px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.top .logo{font-size:18px;font-weight:800;letter-spacing:.2px;color:#21172b;text-decoration:none}
.top .logo span{color:#ed174c}
.top nav{display:flex;gap:16px}.top nav a{font-size:13px;color:#42374a;text-decoration:none}
main.container{max-width:720px!important;padding:18px 14px 32px!important}
.article-wrap{max-width:640px;margin:0 auto!important;background:#fff;padding:20px!important;border:1px solid #f0e1eb;border-radius:12px;box-shadow:0 5px 22px rgba(75,35,65,.06)}
.article-wrap .eyebrow{font-size:10px!important;font-weight:800;letter-spacing:1.3px;color:#ed174c;margin:0 0 7px!important}
.article-wrap h1{font-size:clamp(22px,4vw,32px)!important;line-height:1.32!important;font-weight:800!important;color:#20172a;margin:0 0 9px!important}
.article-meta{font-size:11px!important;color:#85808a!important;border-bottom:1px solid #eee5ed;margin:0 0 8px!important;padding:0 0 9px!important}
.article-views{font-size:11px!important;margin:0 0 12px!important}
.article-wrap>img{display:block;width:100%;height:auto;max-height:390px;object-fit:cover;border-radius:8px;margin:0 0 14px!important}
.article-wrap .article-summary{font-size:15px;line-height:1.65;margin:0 0 12px!important;color:#37313e}
.article-content{font-size:16px!important;line-height:1.7!important;color:#332d39;margin:0!important}
.article-content .news-body-text{white-space:normal!important;line-height:1.7!important;overflow-wrap:anywhere}
.article-content .news-body-text p{margin:0 0 10px!important;padding:0!important;line-height:1.7!important}
.article-content .news-body-text h2{font-size:17px!important;line-height:1.45!important;font-weight:800!important;color:#21172b;margin:12px 0 5px!important;padding:0!important}
.article-content .news-body-text h2:first-child{margin-top:0!important}
.article-wrap>p:last-child{font-size:13px;margin:16px 0 0!important}
.article-wrap>p:last-child a{color:#e51c55;text-decoration:none;font-weight:700}
footer{margin-top:12px}
@media(max-width:600px){
 main.container{padding:10px 9px 24px!important}
 .article-wrap{padding:14px!important;border-radius:9px}
 .top .container.nav{padding:7px 12px;min-height:46px}
 .top .logo{font-size:16px}
 .top nav{gap:10px}.top nav a{font-size:11px}
 .article-wrap h1{font-size:22px!important;line-height:1.32!important}
 .article-content{font-size:14px!important;line-height:1.72!important}
 .article-content .news-body-text p{margin-bottom:9px!important}
 .article-content .news-body-text h2{font-size:15px!important}
 .article-wrap>img{max-height:none;margin-bottom:12px!important}
}
</style>
</head>
<body>

<header class="top">
<div class="container nav">
<a class="logo" href="/">K MEDIA <span>TELUGU</span></a>
<nav>
<a href="index.html">హోమ్</a>
<a href="index.html#latest">తాజా వార్తలు</a>
</nav>
</div>
</header>

<main class="container">
<article id="article" class="article-wrap">వార్త లోడ్ అవుతోంది...</article>
</main>

<footer>
<div class="copyright">© 2026 K Media Telugu. All rights reserved. | <a style="color:#fff" href="/privacy-policy.html">Privacy Policy</a></div>
</footer>

<script>
const db=window.supabase.createClient(
"https://mewyojxgsuceppsauesh.supabase.co",
"sb_publishable_-ee5Pt9U0ZvZuUkipLcq-Q_KBXKsEDa"
);

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

// Convert editor text into evenly spaced paragraphs; collapse excessive blank lines.
const formatNewsContent=value=>{const lines=String(value??'').replace(/\\n/g,'\n').replace(/\r\n?/g,'\n').split('\n').map(line=>line.trim()).filter(Boolean);return `<div class="news-body-text">${lines.map(line=>{const heading=line.match(/^#{1,3}\s+(.+)$/);return heading?`<h2>${esc(heading[1])}</h2>`:`<p>${esc(line.replace(/^[-*]\s+/,''))}</p>`;}).join('')}</div>`;};

(async()=>{
const id=new URLSearchParams(location.search).get('id');
const box=document.getElementById('article');

if(!id){
box.textContent='వార్త ID దొరకలేదు.';
return;
}

const {data,error}=await db.from('news_articles')
.select('title,seo_title,meta_description,summary,content,featured_image,published_at,status,view_count')
.eq('id',id)
.eq('status','published')
.maybeSingle();

if(error||!data){
box.textContent='వార్త అందుబాటులో లేదు. మళ్లీ ప్రయత్నించండి.';
console.error(error);
return;
}

const seoTitle=data.seo_title||data.title;
const staticArticleUrl = "https://kmediatelugu.com/articles/news-"+String(id).replace(/[^a-zA-Z0-9]/g,"").slice(0,8)+"/";
const metaDescription=data.meta_description||data.summary||data.title;


const articleSchema = {
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": seoTitle,
  "description": metaDescription,
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": staticArticleUrl
  },
  "publisher": {
    "@type": "NewsMediaOrganization",
    "@id": "https://kmediatelugu.com/#organization",
    "name": "K Media Telugu",
    "logo": {
      "@type": "ImageObject",
      "url": "https://kmediatelugu.com/K%20Media%20Logo.jpg"
    }
  },
  "author": {
    "@type": "Organization",
    "name": "K Media Telugu"
  },
  "inLanguage": "te-IN",
  ...(data.featured_image ? {"image": [data.featured_image]} : {}),
  ...(data.published_at ? {"datePublished": data.published_at, "dateModified": data.published_at} : {}), "url": staticArticleUrl
};
const schemaScript = document.createElement('script');
schemaScript.type = 'application/ld+json';
schemaScript.textContent = JSON.stringify(articleSchema);
document.head.appendChild(schemaScript);

document.title=seoTitle+' | K Media Telugu';

let description=document.querySelector('meta[name="description"]');
description.setAttribute('content',metaDescription);

let ogTitle=document.createElement('meta');
ogTitle.setAttribute('property','og:title');
ogTitle.setAttribute('content',seoTitle);
document.head.appendChild(ogTitle);

let ogDescription=document.createElement('meta');
ogDescription.setAttribute('property','og:description');
ogDescription.setAttribute('content',metaDescription);
document.head.appendChild(ogDescription);

const socialMeta = (attr, key, value) => {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) { tag = document.createElement('meta'); tag.setAttribute(attr, key); document.head.appendChild(tag); }
  tag.setAttribute('content', value);
};
socialMeta('property','og:type','article');
socialMeta('property','og:image',data.featured_image || 'https://kmediatelugu.com/K%20Media%20Logo.jpg');
socialMeta('property','og:url',staticArticleUrl);
socialMeta('name','twitter:card','summary_large_image');
socialMeta('name','twitter:title',seoTitle);
socialMeta('name','twitter:description',metaDescription);
socialMeta('name','twitter:image',data.featured_image || 'https://kmediatelugu.com/K%20Media%20Logo.jpg');

let canonical=document.querySelector('link[rel="canonical"]');
if (!canonical) { canonical=document.createElement('link'); canonical.setAttribute('rel','canonical'); document.head.appendChild(canonical); }
canonical.setAttribute('href',staticArticleUrl);
socialMeta('property','og:site_name','K Media Telugu');
socialMeta('property','og:locale','te_IN');

box.innerHTML=`
<p class="eyebrow">K MEDIA TELUGU · వార్తలు</p>
<h1>${esc(data.title)}</h1>
<p class="article-meta">${data.published_at?new Date(data.published_at).toLocaleString('te-IN'):''} · K Media Telugu</p>
<div class="article-views" style="display:flex;align-items:center;gap:7px;color:#64748b;font-size:12px;margin:0 0 12px!important"><span aria-hidden="true">👁</span><strong id="articleViewCount">${Number(data.view_count||0).toLocaleString('en-IN')} Views</strong></div>
${data.featured_image?`<img src="${esc(data.featured_image)}" alt="${esc(data.title)}">`:''}
${data.summary?`<p class="article-summary">${esc(data.summary)}</p>`:''}
<div class="article-content">${formatNewsContent(data.content)}</div>
<p><a href="/">← హోమ్‌కు తిరిగి వెళ్లండి</a></p>
`;
// Count one view per browser tab/session; database RPC performs an atomic increment.
try{
  const viewedKey='kmt-viewed-'+id;
  if(!sessionStorage.getItem(viewedKey)){
    const {data:count,error:viewError}=await db.rpc('increment_article_view',{p_article_id:String(id)});
    if(!viewError && count!==null) document.getElementById('articleViewCount').textContent=Number(count).toLocaleString('en-IN')+' Views';
    sessionStorage.setItem(viewedKey,'1');
  }
}catch(viewError){console.warn('View counter unavailable:',viewError);}
})();
</script>
</body>
</html>
