
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="K Media Telugu News Manager - manage Telugu news from your phone.">
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="/K%20Media%20Logo.jpg">
<title>K Media Telugu - News Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#222}
header{background:#101827;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.header-actions{display:flex;gap:8px;align-items:center}
.install{background:#facc15;color:#111;display:none}
input,textarea,select,button{font-family:inherit}
button{min-height:44px}
input,textarea,select{font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
header h2{margin:0;font-size:21px}
button{border:0;border-radius:6px;padding:11px 17px;cursor:pointer;font-weight:bold}
.primary{background:#087c55;color:white}
.danger{background:#dc3545;color:white}
.secondary{background:#64748b;color:white}
main{max-width:1050px;margin:25px auto;padding:15px}
.panel{background:white;padding:22px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 10px #0000000c}
h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccd2dc;border-radius:6px;font-size:15px}
textarea{min-height:130px;resize:vertical}
label{font-weight:bold;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.article{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:8px}
.article h4{margin:0 0 8px}
.small{font-size:13px;color:#64748b}
#dashboard,#logout{display:none}
#message{margin:12px 0;color:#087c55;font-weight:bold}
@media(max-width:600px){
main{padding:10px;margin:12px auto}
header{padding:12px;align-items:center}
header h2{font-size:15px}
.header-actions{gap:6px}
button{padding:10px 12px}
.panel{padding:15px}
.row button{flex:1}
.article{padding:12px}
textarea{min-height:110px}
}
</style>
</head>
<body>

<header>
<h2>K MEDIA TELUGU | ADMIN</h2>
<div class="header-actions">
<button id="installBtn" class="install" type="button">Install App</button>
<button id="logout" class="danger">Logout</button>
</div>
</header>

<main>
<section id="login" class="panel">
<h3>Admin Login</h3>
<label>Email Address</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button class="primary" id="loginBtn">Login</button>
<div id="loginMessage" role="status" aria-live="polite"></div>
</section>

<section id="dashboard" style="display:none">
<div class="panel">
<h3 id="formTitle">Add New News</h3>
<input type="hidden" id="editId">

<label>News Title</label>
<input id="title" placeholder="వార్త శీర్షిక">

<label>Category</label>
<select id="category">
<option value="">Select Category</option>
</select>

<label>Short Summary</label>
<textarea id="summary" placeholder="వార్త సంక్షిప్త వివరణ"></textarea>

<label>SEO Title (Google Search)</label>
<input id="seoTitle" maxlength="70" placeholder="Googleలో కనిపించే Title">

<label>Meta Description (Google Search)</label>
<textarea id="metaDescription" maxlength="160" placeholder="Googleలో కనిపించే చిన్న వివరణ"></textarea>

<label>Full News Content</label>
<textarea id="content" placeholder="పూర్తి వార్త వివరాలు"></textarea>

<label>News Photo (Phone Gallery నుంచి ఎంచుకోండి)</label>
<input id="imageFile" type="file" accept="image/*">
<p class="small">JPG, PNG లేదా WebP ఫోటో. గరిష్టంగా 5 MB.</p>
<img id="imagePreview" alt="Selected news photo preview" style="display:none;width:100%;max-width:320px;max-height:200px;object-fit:contain;border-radius:8px;margin:4px 0 14px">
<label>లేదా Featured Image URL</label>
<input id="image" type="url" placeholder="https://example.com/image.jpg">

<label>Source URL (Optional)</label>
<input id="source" type="url" placeholder="News source link">

<label>Publishing Status</label>
<select id="status">
<option value="draft">Save as Draft</option>
<option value="published">Publish Now</option>
</select>

<div class="row">
<button class="primary" id="saveBtn">Save News</button>
<button class="secondary" id="cancelBtn" style="display:none">Cancel Edit</button>
</div>
<div id="dashboardMessage" role="status" aria-live="polite"></div>
</div>

<div class="panel">
<h3>Published & Draft News</h3>
<button class="secondary" id="refreshBtn">Refresh News</button>
<div id="newsList">Loading...</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://mewyojxgsuceppsauesh.supabase.co";
const SUPABASE_KEY = "sb_publishable_-ee5Pt9U0ZvZuUkipLcq-Q_KBXKsEDa";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $ = id => document.getElementById(id);
let currentPublishedAt = null;

function message(text,color="#087c55",target="dashboardMessage"){
  const el=$(target);
  if(!el)return;
  el.textContent=text;
  el.style.color=color;
}

async function checkAdmin(user){
  const {data,error}=await db.from("admin_users")
    .select("id,display_name")
    .eq("id",user.id)
    .maybeSingle();

  if(error) throw error;
  if(!data) throw new Error("ఈ Account కు Admin Access లేదు.");
  return data;
}

async function loadCategories(){
  const {data,error}=await db.from("categories")
    .select("id,name,slug").order("id");

  if(error) throw error;

  $("category").innerHTML='<option value="">Select Category</option>';
  data.forEach(cat=>{
    const option=document.createElement("option");
    option.value=cat.id;
    option.textContent=cat.name;
    $("category").appendChild(option);
  });
}

async function showDashboard(user){
  try{
    await checkAdmin(user);
    $("login").style.display="none";
    $("dashboard").style.display="block";
    $("logout").style.display="inline-block";
    await loadCategories();
    await loadNews();
  }catch(error){
    message(error.message,"#dc3545","loginMessage");
    await db.auth.signOut();
  }
}

$("loginBtn").onclick=async()=>{
  message("Logging in...","#087c55","loginMessage");
  const {data,error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){message(error.message,"#dc3545","loginMessage");return;}
  await showDashboard(data.user);
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  location.reload();
};

async function loadNews(){
  $("newsList").textContent="Loading...";
  const {data,error}=await db.from("news_articles")
    .select("id,title,slug,status,created_at,category_id")
    .order("created_at",{ascending:false});

  if(error){$("newsList").textContent=error.message;return;}

  $("newsList").innerHTML="";
  if(!data.length){
    $("newsList").textContent="ఇంకా వార్తలు లేవు.";
    return;
  }

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="article";

    const title=document.createElement("h4");
    title.textContent=item.title;

    const info=document.createElement("p");
    info.className="small";
    info.textContent="Status: "+item.status+" | "+new Date(item.created_at).toLocaleString();

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="Edit";
    edit.onclick=()=>editNews(item.id);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="Delete";
    del.style.marginLeft="8px";
    del.onclick=()=>deleteNews(item.id);

    div.append(title,info,edit,del);
    $("newsList").appendChild(div);
  });
}

function makeSlug(text){
  return text.trim().toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu,"-")
    .replace(/^-|-$/g,"")+"-"+Date.now().toString().slice(-6);
}

$("imageFile").addEventListener("change",()=>{
  const file=$("imageFile").files[0];
  const preview=$("imagePreview");
  if(!file){preview.style.display="none";preview.removeAttribute("src");return;}
  if(!file.type.startsWith("image/")||file.size>5*1024*1024){
    message("Image file మాత్రమే ఎంచుకోండి. గరిష్ట పరిమాణం 5 MB.","#dc3545");
    $("imageFile").value="";
    preview.style.display="none";
    return;
  }
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});

async function uploadNewsImage(file){
  if(!file)return $("image").value.trim()||null;
  const extension=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extension;
  const {error}=await db.storage.from("news-images").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=db.storage.from("news-images").getPublicUrl(path);
  return data.publicUrl;
}

$("saveBtn").onclick=async()=>{
  const id=$("editId").value;
  const title=$("title").value.trim();
  const category=$("category").value;
  const content=$("content").value.trim();

  if(!title||!category||!content){
    message("Title, Category, Content తప్పనిసరి.","#dc3545");
    return;
  }

  $("saveBtn").disabled=true;
  try{
    const selectedFile=$("imageFile").files[0];
    const imageUrl=await uploadNewsImage(selectedFile);
    const payload={
    title,
    category_id:Number(category),
    slug:makeSlug(title),
    summary:$("summary").value.trim(),
    seo_title:($("seoTitle").value.trim()||title).slice(0,70),
    meta_description:($("metaDescription").value.trim()||$("summary").value.trim()).slice(0,160),
    content,
    featured_image:imageUrl,
    source_url:$("source").value.trim()||null,
    status:$("status").value,
    updated_at:new Date().toISOString(),
    published_at:$("status").value==="published"?(currentPublishedAt||new Date().toISOString()):null
  };

    let result;
    if(id){
      delete payload.slug;
      result=await db.from("news_articles").update(payload).eq("id",id);
    }else{
      result=await db.from("news_articles").insert(payload);
    }

    if(result.error) throw result.error;

    message(id?"News Updated Successfully!":"News Saved Successfully!");
    resetForm();
    await loadNews();
  }catch(error){
    message(error.message,"#dc3545");
  }finally{
    $("saveBtn").disabled=false;
  }
};

async function editNews(id){
  const {data,error}=await db.from("news_articles")
    .select("*").eq("id",id).single();

  if(error){message(error.message,"#dc3545");return;}

   $("editId").value=data.id;
  currentPublishedAt=data.published_at||null;
  $("title").value=data.title||"";
  $("category").value=data.category_id||"";
  $("summary").value=data.summary||"";
  $("seoTitle").value=data.seo_title||"";
  $("metaDescription").value=data.meta_description||"";
  $("content").value=data.content||"";
  $("image").value=data.featured_image||"";
  $("imageFile").value="";
  if(data.featured_image){$("imagePreview").src=data.featured_image;$("imagePreview").style.display="block";}
  else{$("imagePreview").style.display="none";}
  $("source").value=data.source_url||"";
  $("status").value=data.status||"draft";

  $("formTitle").textContent="Edit News";
  $("saveBtn").textContent="Update News";
  $("cancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteNews(id){
  if(!confirm("ఈ వార్తను Delete చేయాలా?"))return;

  const {error}=await db.from("news_articles").delete().eq("id",id);
  if(error){message(error.message,"#dc3545");return;}

  message("News Deleted Successfully!");
  await loadNews();
}

function resetForm(){
  currentPublishedAt=null;
  ["editId","title","summary","seoTitle","metaDescription","content","image","source","imageFile"].forEach(id=>$(id).value="");
  $("imagePreview").style.display="none";
  $("imagePreview").removeAttribute("src");
  $("category").value="";
  $("status").value="draft";
  $("formTitle").textContent="Add New News";
  $("saveBtn").textContent="Save News";
  $("cancelBtn").style.display="none";
}

$("cancelBtn").onclick=resetForm;
$("refreshBtn").onclick=loadNews;

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session)await showDashboard(data.session.user);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(() => {});
  });
}
let installPrompt = null;
const installButton = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  installPrompt = event;
  if (installButton) installButton.style.display = "inline-block";
});
if (installButton) {
  installButton.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installButton.style.display = "none";
  });
}
window.addEventListener("appinstalled", () => {
  if (installButton) installButton.style.display = "none";
});

</script>
</body>
</html>
