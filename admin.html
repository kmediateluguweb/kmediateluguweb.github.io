
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K Media Telugu - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#222}
header{background:#101827;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;font-size:21px}
button{border:0;border-radius:6px;padding:11px 17px;cursor:pointer;font-weight:bold}
.primary{background:#087c55;color:white}
.danger{background:#dc3545;color:white}
.secondary{background:#64748b;color:white}
main{max-width:1050px;margin:25px auto;padding:15px}
.panel{background:white;padding:22px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 10px #0000000c}
h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccd2dc;border-radius:6px;font-size:15px}
textarea{min-height:130px;resize:vertical}
label{font-weight:bold;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.article{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:8px}
.article h4{margin:0 0 8px}
.small{font-size:13px;color:#64748b}
#dashboard,#logout{display:none}
#message{margin:12px 0;color:#087c55;font-weight:bold}
@media(max-width:600px){main{padding:10px}header{padding:15px}header h2{font-size:17px}}
</style>
</head>
<body>

<header>
<h2>K MEDIA TELUGU | ADMIN</h2>
<button id="logout" class="danger">Logout</button>
</header>

<main>
<section id="login" class="panel">
<h3>Admin Login</h3>
<label>Email Address</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button class="primary" id="loginBtn">Login</button>
<div id="message"></div>
</section>

<section id="dashboard" style="display:none">
<div class="panel">
<h3 id="formTitle">Add New News</h3>
<input type="hidden" id="editId">

<label>News Title</label>
<input id="title" placeholder="వార్త శీర్షిక">

<label>Category</label>
<select id="category">
<option value="">Select Category</option>
</select>

<label>Short Summary</label>
<textarea id="summary" placeholder="వార్త సంక్షిప్త వివరణ"></textarea>

<label>SEO Title (Google Search)</label>
<input id="seoTitle" maxlength="70" placeholder="Googleలో కనిపించే Title">

<label>Meta Description (Google Search)</label>
<textarea id="metaDescription" maxlength="160" placeholder="Googleలో కనిపించే చిన్న వివరణ"></textarea>

<label>Full News Content</label>
<textarea id="content" placeholder="పూర్తి వార్త వివరాలు"></textarea>

<label>Featured Image URL</label>
<input id="image" type="url" placeholder="https://example.com/image.jpg">

<label>Source URL (Optional)</label>
<input id="source" type="url" placeholder="News source link">

<label>Publishing Status</label>
<select id="status">
<option value="draft">Save as Draft</option>
<option value="published">Publish Now</option>
</select>

<div class="row">
<button class="primary" id="saveBtn">Save News</button>
<button class="secondary" id="cancelBtn" style="display:none">Cancel Edit</button>
</div>
<div id="message"></div>
</div>

<div class="panel">
<h3>Published & Draft News</h3>
<button class="secondary" id="refreshBtn">Refresh News</button>
<div id="newsList">Loading...</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://mewyojxgsuceppsauesh.supabase.co";
const SUPABASE_KEY = "sb_publishable_-ee5Pt9U0ZvZuUkipLcq-Q_KBXKsEDa";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $ = id => document.getElementById(id);

function message(text,color="#087c55"){
  $("message").textContent=text;
  $("message").style.color=color;
}

async function checkAdmin(user){
  const {data,error}=await db.from("admin_users")
    .select("id,display_name")
    .eq("id",user.id)
    .maybeSingle();

  if(error) throw error;
  if(!data) throw new Error("ఈ Account కు Admin Access లేదు.");
  return data;
}

async function loadCategories(){
  const {data,error}=await db.from("categories")
    .select("id,name,slug").order("id");

  if(error) throw error;

  $("category").innerHTML='<option value="">Select Category</option>';
  data.forEach(cat=>{
    const option=document.createElement("option");
    option.value=cat.id;
    option.textContent=cat.name;
    $("category").appendChild(option);
  });
}

async function showDashboard(user){
  try{
    await checkAdmin(user);
    $("login").style.display="none";
    $("dashboard").style.display="block";
    $("logout").style.display="inline-block";
    await loadCategories();
    await loadNews();
  }catch(error){
    message(error.message,"#dc3545");
    await db.auth.signOut();
  }
}

$("loginBtn").onclick=async()=>{
  message("Logging in...");
  const {data,error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){message(error.message,"#dc3545");return;}
  await showDashboard(data.user);
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  location.reload();
};

async function loadNews(){
  $("newsList").textContent="Loading...";
  const {data,error}=await db.from("news_articles")
    .select("id,title,slug,status,created_at,category_id")
    .order("created_at",{ascending:false});

  if(error){$("newsList").textContent=error.message;return;}

  $("newsList").innerHTML="";
  if(!data.length){
    $("newsList").textContent="ఇంకా వార్తలు లేవు.";
    return;
  }

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="article";

    const title=document.createElement("h4");
    title.textContent=item.title;

    const info=document.createElement("p");
    info.className="small";
    info.textContent="Status: "+item.status+" | "+new Date(item.created_at).toLocaleString();

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="Edit";
    edit.onclick=()=>editNews(item.id);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="Delete";
    del.style.marginLeft="8px";
    del.onclick=()=>deleteNews(item.id);

    div.append(title,info,edit,del);
    $("newsList").appendChild(div);
  });
}

function makeSlug(text){
  return text.trim().toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu,"-")
    .replace(/^-|-$/g,"")+"-"+Date.now().toString().slice(-6);
}

$("saveBtn").onclick=async()=>{
  const id=$("editId").value;
  const title=$("title").value.trim();
  const category=$("category").value;
  const content=$("content").value.trim();

  if(!title||!category||!content){
    message("Title, Category, Content తప్పనిసరి.","#dc3545");
    return;
  }

  const payload={
    title,
    category_id:Number(category),
    slug:makeSlug(title),
    summary:$("summary").value.trim(),
    seo_title:$("seoTitle").value.trim()||title,
    meta_description:$("metaDescription").value.trim()||$("summary").value.trim(),
    content,
    featured_image:$("image").value.trim()||null,
    source_url:$("source").value.trim()||null,
    status:$("status").value,
    updated_at:new Date().toISOString(),
    published_at:$("status").value==="published"?new Date().toISOString():null
  };

  $("saveBtn").disabled=true;
  try{
    let result;
    if(id){
      delete payload.slug;
      result=await db.from("news_articles").update(payload).eq("id",id);
    }else{
      result=await db.from("news_articles").insert(payload);
    }

    if(result.error) throw result.error;

    message(id?"News Updated Successfully!":"News Saved Successfully!");
    resetForm();
    await loadNews();
  }catch(error){
    message(error.message,"#dc3545");
  }finally{
    $("saveBtn").disabled=false;
  }
};

async function editNews(id){
  const {data,error}=await db.from("news_articles")
    .select("*").eq("id",id).single();

  if(error){message(error.message,"#dc3545");return;}

  $("editId").value=data.id;
  $("title").value=data.title||"";
  $("category").value=data.category_id||"";
  $("summary").value=data.summary||"";
  $("seoTitle").value=data.seo_title||"";
  $("metaDescription").value=data.meta_description||"";
  $("content").value=data.content||"";
  $("image").value=data.featured_image||"";
  $("source").value=data.source_url||"";
  $("status").value=data.status||"draft";

  $("formTitle").textContent="Edit News";
  $("saveBtn").textContent="Update News";
  $("cancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteNews(id){
  if(!confirm("ఈ వార్తను Delete చేయాలా?"))return;

  const {error}=await db.from("news_articles").delete().eq("id",id);
  if(error){message(error.message,"#dc3545");return;}

  message("News Deleted Successfully!");
  await loadNews();
}

function resetForm(){
  ["editId","title","summary","seoTitle","metaDescription","content","image","source"].forEach(id=>$(id).value="");
  $("category").value="";
  $("status").value="draft";
  $("formTitle").textContent="Add New News";
  $("saveBtn").textContent="Save News";
  $("cancelBtn").style.display="none";
}

$("cancelBtn").onclick=resetForm;
$("refreshBtn").onclick=loadNews;

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session)await showDashboard(data.session.user);
})();
</script>
</body>
</html>
