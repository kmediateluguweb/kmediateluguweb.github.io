name: Collect Telugu cinema news drafts
on:
  push:
    paths:
      - "scripts/collect-telugu-news.mjs"
      - ".github/workflows/collect-telugu-news.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 0,8,16 * * *"
permissions:
  contents: read
concurrency:
  group: telugu-news-draft-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect RSS news as drafts
        env:
          SUPABASE_URL: https://mewyojxgsuceppsauesh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          GEMINI_MODEL: "gemini-2.5-flash-lite"
        run: node scripts/collect-telugu-news.mjs
