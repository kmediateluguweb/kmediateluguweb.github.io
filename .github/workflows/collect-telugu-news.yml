name: Collect Telugu cinema news drafts
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: telugu-news-draft-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect RSS news as drafts
        env:
          SUPABASE_URL: https://mewyojxgsuceppsauesh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        run: node scripts/collect-telugu-news.mjs
