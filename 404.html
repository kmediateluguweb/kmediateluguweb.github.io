<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>వార్త లోడ్ అవుతోంది | K Media Telugu</title>
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:#fff8fc;color:#292333;font-family:Arial,"Noto Sans Telugu",sans-serif}
.container{width:min(1000px,94%);margin:24px auto}
.article{background:#fff;padding:clamp(16px,4vw,32px);border:1px solid #f0e1eb;border-radius:12px;box-shadow:0 5px 22px #4b23410a}
h1{font-size:clamp(23px,4vw,34px);line-height:1.45;color:#20172a}
.meta{color:#85808a;font-size:12px}
.photo{display:block;width:100%;max-width:800px;max-height:440px;object-fit:contain;margin:18px auto;border-radius:8px}
.content{font-size:16px;line-height:1.8;overflow-wrap:anywhere}
.content p{margin:0 0 14px}.content h2{font-size:22px;color:#21172b;margin:24px 0 8px}
.share{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0;padding:14px 0;border-block:1px solid #eee}
.share a,.share button{padding:9px 12px;border:1px solid #eadde7;border-radius:7px;background:white;color:#33283b;text-decoration:none;font-weight:700;font-size:12px}
.error{padding:18px;background:#fff5f5;border:1px solid #f3cccc;border-radius:8px}
</style>
</head>
<body>
<header style="background:#fff;border-bottom:1px solid #eee"><div class="container" style="margin:0 auto;padding:12px 0"><a href="/" style="font-weight:900;color:#21172b;text-decoration:none">K MEDIA <span style="color:#ed174c">TELUGU</span></a>　<a href="/" style="color:#42374a">హోమ్</a></div></header>
<main class="container"><article class="article" id="article"><p>వార్తను లోడ్ చేస్తున్నాం…</p></article></main>
<footer style="background:#21172b;color:#fff;text-align:center;padding:16px;font-size:12px">© 2026 K Media Telugu. All rights reserved.</footer>
<script>
(async()=>{
 const path=location.pathname.replace(/\/+$/,"");
 const match=path.match(/^\/articles\/(news-[a-zA-Z0-9]{8})(?:-[0-9]+)?$/);
 const root=document.getElementById("article");
 if(!match){root.innerHTML='<div class="error"><h1>పేజీ కనుగొనబడలేదు</h1><p>మీరు కోరిన పేజీ అందుబాటులో లేదు.</p><a href="/">హోమ్‌కు వెళ్లండి</a></div>';return;}
 const requested=match[1];
 const API="https://mewyojxgsuceppsauesh.supabase.co";
 const KEY="sb_publishable_-ee5Pt9U0ZvZuUkipLcq-Q_KBXKsEDa";
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const slugFor=id=>"news-"+String(id).replace(/[^a-zA-Z0-9]/g,"").slice(0,8);
 try{
  const response=await fetch(API+"/rest/v1/news_articles?select=id,title,summary,content,featured_image,published_at,seo_title,meta_description,status&status=eq.published&order=published_at.desc&limit=1000",{headers:{apikey:KEY},cache:"no-store"});
  if(!response.ok)throw new Error("వార్తల డేటాబేస్ స్పందించలేదు ("+response.status+")");
  const rows=await response.json();
  const item=rows.find(x=>slugFor(x.id)===requested);
  if(!item){root.innerHTML='<div class="error"><h1>ఈ వార్త ఇంకా అందుబాటులో లేదు</h1><p>వార్త ప్రచురించబడిన తర్వాత కొద్దిసేపటికి మళ్లీ ప్రయత్నించండి.</p><a href="/">తాజా వార్తలకు వెళ్లండి</a></div>';return;}
  const title=item.title||"K Media Telugu";
  const description=item.meta_description||item.summary||title;
  const date=item.published_at?new Date(item.published_at).toLocaleString("te-IN",{timeZone:"Asia/Kolkata"}):"";
  const lines=String(item.content||"").replace(/\\n/g,"\n").split(/\r?\n/);
  const body=lines.map(line=>{const s=line.trim();if(!s)return "";const h=s.match(/^#{1,3}\s+(.+)$/)||s.match(/^\*\*(.+)\*\*$/);return h?"<h2>"+esc(h[1])+"</h2>":"<p>"+esc(s.replace(/^[-*]\s+/,"")).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")+"</p>";}).join("");
  document.title=title+" | K Media Telugu";
  document.querySelector('meta[name="description"]').content=description.slice(0,300);
  const canonical="https://kmediatelugu.com/articles/"+requested+"/";
  const og=document.createElement("meta");og.setAttribute("property","og:title");og.content=title;document.head.appendChild(og);
  const ogd=document.createElement("meta");ogd.setAttribute("property","og:description");ogd.content=description;document.head.appendChild(ogd);
  const img=item.featured_image?'<img class="photo" src="'+esc(item.featured_image)+'" alt="'+esc(title)+'">':"";
  root.innerHTML='<p style="color:#ed174c;font-size:11px;font-weight:800">K MEDIA TELUGU</p><h1>'+esc(title)+'</h1><p class="meta">'+esc(date)+' · K Media Telugu</p>'+img+(item.summary?'<p><strong>'+esc(item.summary)+'</strong></p>':"")+'<div class="content">'+body+'</div><div class="share"><a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(title+" "+canonical)+'">WhatsApp</a><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(canonical)+'">Facebook</a><a target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(canonical)+'&text='+encodeURIComponent(title)+'">Telegram</a><button id="copy">లింక్ Copy</button></div><p><a href="/">← హోమ్‌కు తిరిగి వెళ్లండి</a></p>';
  document.getElementById("copy").addEventListener("click",async()=>{await navigator.clipboard.writeText(canonical);document.getElementById("copy").textContent="Copied ✓";});
 }catch(error){root.innerHTML='<div class="error"><h1>వార్తను లోడ్ చేయలేకపోయాం</h1><p>'+esc(error.message)+'</p><p>కొద్దిసేపటి తర్వాత మళ్లీ ప్రయత్నించండి.</p><a href="/">హోమ్‌కు వెళ్లండి</a></div>';}
})();
</script>
</body></html>
